version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: makanza-postgres
    restart: always
    environment:
      POSTGRES_DB: makanzadb
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d makanzadb"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: makanza-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      JDBC_DATABASE_URL: "jdbc:postgresql://postgres:5432/makanzadb"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
